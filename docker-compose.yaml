version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    # [추가] 브로커가 실패하거나 서버 재부팅 시 자동으로 다시 뜨도록 설정
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://${EC2_PUBLIC_IP}:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NUM_PARTITIONS: 1
    networks:
      - auction-network
    volumes:
      - ./kafka_data:/var/lib/kafka/data
    healthcheck:
    # [수정] 부팅 시 안정성을 위해 헬스체크 간격을 조금 더 여유 있게 조정
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - auction-network

  # --- 아래 모든 서비스의 restart 변경합니다 ---

  producer-consumable:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/collector/producer_consumable.py
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      - KAFKA_SERVER=kafka:29092
      - PYTHONPATH=/app
    networks:
      - auction-network

  producer-equip:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/collector/producer_listings.py
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      - KAFKA_SERVER=kafka:29092
      - PYTHONPATH=/app
    networks:
      - auction-network

  producer-history:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/collector/producer_history.py
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      - KAFKA_SERVER=kafka:29092
      - PYTHONPATH=/app
    networks:
      - auction-network

  anomaly-detector:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/processor/anomaly_detector.py
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      - KAFKA_SERVER=kafka:29092
      - PYTHONPATH=/app
    networks:
      - auction-network

  event-processor-equipment:
    build: { context: ., dockerfile: Dockerfile }
    env_file: .env
    command: python kafka_auction/processor/processor_equipment_events.py
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=kafka:29092
      - PYTHONPATH=/app
    networks:
      - auction-network

  event-processor-consumable:
    build: { context: ., dockerfile: Dockerfile }
    env_file: .env
    command: python kafka_auction/processor/processor_consumable_events.py
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=kafka:29092
      - PYTHONPATH=/app
    networks:
      - auction-network

  db-sink-consumer:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/sink/consumer_db_sink.py
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BROKER}
      - TOPIC_EVENTS=${KAFKA_TOPIC_EVENTS}
      - KAFKA_SINK_GROUP_ID=${KAFKA_DB_SINK_GROUP_ID}
      - PYTHONPATH=/app
    networks:
      - auction-network

  s3-listings-loader:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/sink/s3_listings_loader.py
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      - KAFKA_SERVER=kafka:29092
      - PYTHONPATH=/app
      - SPOOL_DIR=/app/spool/listings
    networks:
      - auction-network
    volumes:
      - ./spool/listings:/app/spool/listings

  s3-history-loader:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/sink/s3_history_loader.py
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      - KAFKA_SERVER=kafka:29092
      - PYTHONPATH=/app
      - SPOOL_DIR=/app/spool/history
    networks:
      - auction-network
    volumes:
      - ./spool/history:/app/spool/history

networks:
  auction-network:
    driver: bridge