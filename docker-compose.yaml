version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://${EC2_PUBLIC_IP}:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - ./kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on: [kafka]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # 1. 소비성 아이템 수집기
  producer-consumable:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/collector/producer_consumable.py 
    restart: on-failure
    depends_on: [kafka]
    env_file: .env 
    environment:
      - KAFKA_SERVER=kafka:29092
      - PYTHONPATH=/app

  # 2. 장비류 수집기 
  producer-equip:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/collector/producer_listings.py 
    restart: on-failure
    depends_on: [kafka]
    env_file: .env
    environment:
      - KAFKA_SERVER=kafka:29092
      - PYTHONPATH=/app

  # 3. 거래 내역 수집기
  producer-history:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/collector/producer_history.py 
    restart: on-failure
    depends_on: [kafka]
    env_file: .env 
    environment:
      - KAFKA_SERVER=kafka:29092
      - PYTHONPATH=/app

  # 4. 이상거래 탐지기
  anomaly-detector:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/processor/anomaly_detector.py
    restart: on-failure
    depends_on: [kafka]
    env_file: .env
    environment:
      - KAFKA_SERVER=kafka:29092
      - PYTHONPATH=/app

  # 5. 이벤트 프로세서
  event-processor:
    build: { context: ., dockerfile: Dockerfile }
    env_file: .env
    command: python kafka_auction/processor/processor_equipment_events.py 
    restart: on-failure
    depends_on: [kafka]
    environment:
      - KAFKA_BROKER=kafka:9092
      - PYTHONPATH=/app

  # 6. DB 적재기
  db-sink-consumer:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/sink/consumer_db_sink.py 
    restart: on-failure
    depends_on: [kafka]
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BROKER}
      - TOPIC_EVENTS=${KAFKA_TOPIC_EVENTS}
      - KAFKA_SINK_GROUP_ID=${KAFKA_DB_SINK_GROUP_ID}  # 그룹 ID 매핑
      - PYTHONPATH=/app

  # 7. S3 적재기 - 거래 목록
  s3-listings-loader:
    build: { context: ., dockerfile: Dockerfile }
    command: python kafka_auction/sink/s3_listings_loader.py 
    restart: on-failure
    depends_on: [kafka]
    env_file: .env
    environment:
      - KAFKA_SERVER=kafka:29092
      - PYTHONPATH=/app
      - SPOOL_DIR=/app/spool/listings
    volumes:
      - ./spool/listings:/app/spool/listings

  # 8. S3 적재기 - 거래 내역
  s3-history-loader:
    build: { context: ., dockerfile: Dockerfile }  
    command: python kafka_auction/sink/s3_history_loader.py
    restart: on-failure
    depends_on: [kafka]
    env_file: .env 
    environment:
      - KAFKA_SERVER=kafka:29092
      - PYTHONPATH=/app
      - SPOOL_DIR=/app/spool/history 
      - ./spool/history:/app/spool/history 

networks:
  default:
    name: auction-network